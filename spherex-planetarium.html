<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPHEREx Blink</title>
<style>
  :root {
    --ink: #0a1224; --panel: #121c33; --line: #2a3858;
    --paper: #ece6d6; --muted: #9aa6c2; --marker: #ffb347;
    font-family: system-ui, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #03060f; color: var(--paper); line-height: 1.5; }
  main { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }

  aside { background: var(--panel); border-right: 1px solid var(--line); padding: 1.5rem; }
  h1 { margin: 0 0 .25rem; font-size: 1.6rem; }
  .lede, .hint { color: var(--muted); font-size: .92rem; }
  form { display: grid; gap: 1rem; margin: 1.5rem 0 1rem; }
  label { display: grid; gap: .3rem; font-size: .92rem; }
  input, select, button {
    font: inherit; color: var(--paper); background: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; padding: .55rem .7rem;
  }
  button { cursor: pointer; background: var(--marker); color: #1a1205; border-color: var(--marker); font-weight: 700; }
  button:hover { filter: brightness(1.08); }
  :focus-visible { outline: 2px solid var(--marker); outline-offset: 2px; }

  .stage { display: grid; place-items: center; align-content: center; gap: .75rem; padding: 1.5rem; }
  #dome { width: min(100%, calc(80vh * 1.6)); aspect-ratio: 16 / 10; display: block; cursor: grab; touch-action: none;
          border: 1px solid #1f315c; }
  #dome:active { cursor: grabbing; }
  .caption { margin: 0; color: var(--muted); font-size: .92rem; text-align: center; max-width: 60ch; }

  @media (max-width: 760px) {
    main { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<main>
  <aside>
    <h1>SPHEREx Blink</h1>
    <p class="lede">Pick a spot on the sky, then flip through infrared images of it and watch for dots that move.</p>
    <form onsubmit="return false">
      <label>Target
        <input placeholder="Barnard's Star, or 133.795 -7.245">
      </label>
      <label>Field of view (arcminutes)
        <input type="number" value="6">
      </label>
      <label>Detector band
        <select>
          <option>All bands</option><option>D1</option><option>D2</option>
          <option>D3</option><option>D4</option><option>D5</option><option>D6</option>
        </select>
      </label>
      <label>View
        <select>
          <option>Sky images</option>
          <option>Changes only (frame minus median)</option>
        </select>
      </label>
      <button>Load images</button>
    </form>
    <p class="hint">Design preview only. The controls do nothing yet.</p>
  </aside>

  <div class="stage">
    <canvas id="dome" aria-label="View of the night sky from inside the celestial sphere. Drag to look around."></canvas>
    <p class="caption">Drag to look around. Scroll to zoom. The bright stars sit at their real positions; the faint stars and the Milky Way are decorative.</p>
  </div>
</main>

<script>
const D2R = Math.PI / 180;
const vec = (ra, dec) => { const a = ra * D2R, d = dec * D2R; return [Math.cos(d) * Math.cos(a), Math.cos(d) * Math.sin(a), Math.sin(d)]; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));

// ---------- Bright stars: name, RA (deg), Dec (deg), magnitude, colour (J2000, approximate) ----------
const STAR_DATA = [
  ["Sirius",101.287,-16.716,-1.46,"#cfe0ff"], ["Arcturus",213.915,19.182,-0.05,"#ffcf9a"], ["Vega",279.234,38.784,0.03,"#d6e4ff"],
  ["Capella",79.172,45.998,0.08,"#fff0c0"], ["Rigel",78.634,-8.202,0.13,"#bcd2ff"], ["Procyon",114.825,5.225,0.34,"#fff6e0"],
  ["Betelgeuse",88.793,7.407,0.5,"#ff9a6a"], ["Altair",297.696,8.868,0.76,"#f2f4ff"], ["Aldebaran",68.980,16.509,0.85,"#ffb27a"],
  ["Antares",247.352,-26.432,1.06,"#ff8a60"], ["Spica",201.298,-11.161,1.04,"#bcd2ff"], ["Pollux",116.329,28.026,1.14,"#ffd9a8"],
  ["Fomalhaut",344.413,-29.622,1.16,"#eaf0ff"], ["Deneb",310.358,45.280,1.25,"#eaf0ff"], ["Regulus",152.093,11.967,1.35,"#cfe0ff"],
  ["Castor",113.650,31.888,1.58,"#e6eeff"], ["Polaris",37.954,89.264,1.98,"#fff4d0"],
  ["Bellatrix",81.283,6.350,1.64,"#bcd2ff"], ["Alnilam",84.053,-1.202,1.69,"#bcd2ff"], ["Alnitak",85.190,-1.943,1.77,"#bcd2ff"],
  ["Mintaka",83.002,-0.299,2.23,"#bcd2ff"], ["Saiph",86.939,-9.670,2.06,"#bcd2ff"],
  ["Dubhe",165.932,61.751,1.79,"#ffcf9a"], ["Merak",165.460,56.383,2.37,"#eaf0ff"], ["Phecda",178.458,53.695,2.44,"#eaf0ff"],
  ["Megrez",183.857,57.033,3.31,"#eaf0ff"], ["Alioth",193.507,55.960,1.77,"#eaf0ff"], ["Mizar",200.981,54.925,2.27,"#eaf0ff"], ["Alkaid",206.886,49.313,1.86,"#bcd2ff"],
  ["Schedar",10.127,56.537,2.24,"#ffcf9a"], ["Caph",2.295,59.150,2.28,"#fff6e0"], ["Gamma Cas",14.177,60.717,2.47,"#bcd2ff"],
  ["Ruchbah",21.454,60.235,2.68,"#eaf0ff"], ["Segin",28.599,63.670,3.38,"#bcd2ff"],
  ["Acrux",186.650,-63.099,0.76,"#bcd2ff"], ["Mimosa",191.930,-59.689,1.25,"#bcd2ff"], ["Gacrux",187.791,-57.113,1.63,"#ff9a6a"], ["Delta Cru",183.786,-58.749,2.79,"#bcd2ff"]
];
const STARS = {}; STAR_DATA.forEach(([n, ra, dec, mag, col]) => STARS[n] = { n, v: vec(ra, dec), mag, col });
const LINES = [
  ["Betelgeuse","Bellatrix"],["Betelgeuse","Alnitak"],["Bellatrix","Mintaka"],["Alnitak","Alnilam"],["Alnilam","Mintaka"],["Alnitak","Saiph"],["Mintaka","Rigel"],
  ["Dubhe","Merak"],["Merak","Phecda"],["Phecda","Megrez"],["Megrez","Dubhe"],["Megrez","Alioth"],["Alioth","Mizar"],["Mizar","Alkaid"],
  ["Caph","Schedar"],["Schedar","Gamma Cas"],["Gamma Cas","Ruchbah"],["Ruchbah","Segin"],
  ["Acrux","Gacrux"],["Mimosa","Delta Cru"],["Vega","Deneb"],["Deneb","Altair"],["Altair","Vega"]
];

// ---------- Decorative background: faint random stars + a Milky Way band ----------
function randn() { return Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random()); }
const FAINT = new Float32Array(2600 * 4);                       // x, y, z, brightness
for (let i = 0; i < 2600; i++) {
  let x = randn(), y = randn(), z = randn(); const n = Math.hypot(x, y, z);
  FAINT.set([x / n, y / n, z / n, 0.18 + Math.pow(Math.random(), 3) * 0.7], i * 4);
}
const cross = (a, b) => [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const GC = vec(266.405, -28.936), NGP = vec(192.860, 27.128), G2 = cross(NGP, GC);   // galactic centre, pole, in-plane axis
const MW = new Float32Array(9000 * 4);
for (let i = 0; i < 9000; i++) {
  const l = Math.random() * Math.PI * 2;
  const bulge = Math.exp(-Math.pow(Math.atan2(Math.sin(l), Math.cos(l)), 2) * 1.2);       // denser toward the centre
  if (Math.random() > 0.35 + 0.65 * bulge) { i--; continue; }
  const b = randn() * (0.10 + 0.08 * bulge);
  const cb = Math.cos(b), sb = Math.sin(b), cl = Math.cos(l), sl = Math.sin(l);
  MW.set([0, 1, 2].map(k => cb * (cl * GC[k] + sl * G2[k]) + sb * NGP[k]).concat([0.03 + Math.random() * 0.09]), i * 4);
}

// ---------- View: a stereographic projection, like planetarium software ----------
const canvas = document.getElementById("dome"), ctx = canvas.getContext("2d");
let ra0 = 84, dec0 = 12, fov = 100, W = 0, H = 0, CX = 0, CY = 0, R = 0, scale = 1, dpr = 1;   // fov = width of the view, in degrees
let c0, c1, c2, e0, e1, n0, n1, n2, X = 0, Y = 0;

function setupBasis() {
  const a = ra0 * D2R, d = dec0 * D2R;
  c0 = Math.cos(d) * Math.cos(a); c1 = Math.cos(d) * Math.sin(a); c2 = Math.sin(d);   // where you are looking
  e0 = -Math.sin(a); e1 = Math.cos(a);                                                  // east
  n0 = -Math.sin(d) * Math.cos(a); n1 = -Math.sin(d) * Math.sin(a); n2 = Math.cos(d);   // north
  scale = (W / 2) / (2 * Math.tan(fov * D2R / 4));
}
function proj(x, y, z) {                       // sky vector -> screen (X, Y); false if behind you
  const cx = x * c0 + y * c1 + z * c2;
  if (cx < -0.92) return false;
  const k = 2 / (1 + cx);
  X = CX - k * (x * e0 + y * e1) * scale;      // east is to the left, as on the real sky
  Y = CY - k * (x * n0 + y * n1 + z * n2) * scale;
  return true;
}
function curve(points, close) {               // draw a polyline, lifting the pen where the sky wraps behind
  let pen = false;
  for (const p of points) {
    if (proj(p[0], p[1], p[2])) { pen ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); pen = true; } else pen = false;
  }
}

// Reference curves (built once)
const GRID = [];
for (let ra = 0; ra < 360; ra += 30) { const p = []; for (let d = -88; d <= 88; d += 4) p.push(vec(ra, d)); GRID.push(p); }
for (let d = -60; d <= 60; d += 30) { const p = []; for (let ra = 0; ra <= 360; ra += 4) p.push(vec(ra, d)); GRID.push(p); }
const EPS = 23.4393 * D2R, ECLIPTIC = [];
for (let l = 0; l <= 360; l += 2) { const s = Math.sin(l * D2R), c = Math.cos(l * D2R); ECLIPTIC.push([c, s * Math.cos(EPS), s * Math.sin(EPS)]); }

function draw() {
  setupBasis();
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);

  const sky = ctx.createRadialGradient(CX, CY, 0, CX, CY, R);      // deep blue at the middle, near-black at the corners
  sky.addColorStop(0, "#0b1530"); sky.addColorStop(1, "#02040b");
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = "lighter";                         // Milky Way
  ctx.fillStyle = "rgb(150,175,255)";
  for (let i = 0; i < MW.length; i += 4) {
    if (!proj(MW[i], MW[i+1], MW[i+2])) continue;
    ctx.globalAlpha = MW[i+3]; const s = 2.2 * dpr; ctx.fillRect(X - s / 2, Y - s / 2, s, s);
  }
  ctx.fillStyle = "#fff";                                           // faint stars
  for (let i = 0; i < FAINT.length; i += 4) {
    if (!proj(FAINT[i], FAINT[i+1], FAINT[i+2])) continue;
    ctx.globalAlpha = FAINT[i+3]; const s = (FAINT[i+3] > .6 ? 1.6 : 1.1) * dpr; ctx.fillRect(X - s / 2, Y - s / 2, s, s);
  }
  ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;

  ctx.lineWidth = dpr; ctx.strokeStyle = "rgba(90,120,190,.28)";    // RA/Dec grid
  ctx.beginPath(); GRID.forEach(g => curve(g)); ctx.stroke();

  ctx.strokeStyle = "rgba(255,179,71,.75)"; ctx.setLineDash([7 * dpr, 6 * dpr]);   // ecliptic
  ctx.beginPath(); curve(ECLIPTIC); ctx.stroke(); ctx.setLineDash([]);

  ctx.strokeStyle = "rgba(150,185,255,.4)"; ctx.beginPath();        // constellation lines
  for (const [a, b] of LINES) { const A = STARS[a].v, B = STARS[b].v;
    if (proj(...A)) { const x1 = X, y1 = Y; if (proj(...B)) { ctx.moveTo(x1, y1); ctx.lineTo(X, Y); } } }
  ctx.stroke();

  ctx.font = `${12 * dpr}px system-ui, sans-serif`; ctx.textBaseline = "middle";
  for (const s of Object.values(STARS)) {                           // bright stars
    if (!proj(...s.v)) continue;
    const r = clamp(3.4 - s.mag * 0.75, 1.1, 5.2) * dpr;
    const glow = ctx.createRadialGradient(X, Y, 0, X, Y, r * 4);
    glow.addColorStop(0, s.col); glow.addColorStop(0.25, s.col + "66"); glow.addColorStop(1, s.col + "00");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(X, Y, r * 4, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(X, Y, r * 0.7, 0, 7); ctx.fill();
    if (s.mag < 1.7) { ctx.fillStyle = "rgba(236,230,214,.85)"; ctx.fillText(s.n, X + r * 2 + 4 * dpr, Y); }
  }

  // Red crosshair marking the exact centre of the view
  const gap = 8 * dpr, arm = 26 * dpr;
  ctx.strokeStyle = "#ff3b3b"; ctx.lineWidth = 1.5 * dpr; ctx.beginPath();
  ctx.moveTo(CX - arm, CY); ctx.lineTo(CX - gap, CY); ctx.moveTo(CX + gap, CY); ctx.lineTo(CX + arm, CY);
  ctx.moveTo(CX, CY - arm); ctx.lineTo(CX, CY - gap); ctx.moveTo(CX, CY + gap); ctx.lineTo(CX, CY + arm);
  ctx.stroke();
}

// ---------- Size, drag, zoom, slow drift ----------
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = Math.round(canvas.clientWidth * dpr); H = Math.round(canvas.clientHeight * dpr);
  canvas.width = W; canvas.height = H; CX = W / 2; CY = H / 2; R = Math.hypot(W, H) / 2; dirty = true;
}
let dirty = true, dragging = false, last = null, vx = 0, vy = 0, idle = !matchMedia("(prefers-reduced-motion: reduce)").matches;
const degPerPx = () => fov / canvas.clientWidth;          // roughly how far one dragged pixel turns the view
function turn(dx, dy) {
  ra0 = (ra0 + dx * degPerPx() / Math.max(0.25, Math.cos(dec0 * D2R)) + 360) % 360;
  dec0 = clamp(dec0 + dy * degPerPx(), -89, 89); dirty = true;
}
canvas.addEventListener("pointerdown", e => { dragging = true; idle = false; last = e; vx = vy = 0; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener("pointermove", e => {
  if (!dragging) return;
  vx = e.clientX - last.clientX; vy = e.clientY - last.clientY; last = e; turn(vx, vy);
});
canvas.addEventListener("pointerup", () => { dragging = false; });
canvas.addEventListener("wheel", e => { e.preventDefault(); idle = false; fov = clamp(fov * (1 + Math.sign(e.deltaY) * 0.08), 20, 160); dirty = true; }, { passive: false });
new ResizeObserver(resize).observe(canvas);
resize();

(function loop() {
  if (!dragging && (Math.abs(vx) > 0.05 || Math.abs(vy) > 0.05)) { turn(vx, vy); vx *= 0.93; vy *= 0.93; }   // glide after a flick
  if (idle) { ra0 = (ra0 - 0.004 + 360) % 360; dirty = true; }       // the sky turns slowly
  if (dirty) { draw(); dirty = false; }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
